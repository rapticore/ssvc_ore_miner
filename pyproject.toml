[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rapticoressvc"
version = "0.0.18"
authors = [
  { name="Rapticore", email="ahsan.mir@rapticore.com" },
]
description = "Rapticore SSVC"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
dependencies = [
    "aws-lambda-powertools>=2.12.0",
    "boto3>=1.26.110",
    "numpy>=1.24.0,<1.25.0",
    "pandas>=1.5.0,<2.0.0",
    "requests>=2.31.0",
    "setuptools>=62.2.0",
    "urllib3>=1.26.18",
    "xlsxwriter>=3.0.8",
]

[project.optional-dependencies]
# Redis cache backend (STORAGE_TYPE=redis). Optional: local/s3 users don't need it.
redis = ["redis>=4.2.0"]

[project.urls]
"Homepage" = "https://github.com/rapticore/ssvc_ore_miner"
"Bug Tracker" = "https://github.com/rapticore/ssvc_ore_miner/issues"
"Documentation" = "https://github.com/rapticore/ssvc_ore_miner#readme"

[project.scripts]
ssvc-ore = "rapticoressvc.ssvc_ore:main"

[tool.setuptools]
# Explicit package list: ship only runtime packages (no test/ or docs/).
packages = ["rapticoressvc", "rapticoressvc.storage_helpers"]

[tool.setuptools.package-data]
# The decision tables are loaded at runtime and MUST ship in the wheel.
"rapticoressvc" = ["*.csv"]
